{% extends "students/base.html" %}

{% block title %}Delete {{ student.name }} · Student Desk{% endblock %}

{% block content %}
<section class="confirm-wrap">
    <form class="panel confirm-panel" method="post">
        {% csrf_token %}
        <div class="confirm-icon">!</div>
        <p class="eyebrow">CONFIRM ACTION</p>
        <h1>Delete this student?</h1>
        <p class="muted">The record for <strong>{{ student.name }}</strong> will be permanently removed. This can't be undone.</p>
        <div class="form-actions">
            <a class="button button-quiet" href="{% url 'students:detail' student.pk %}">Cancel</a>
            <button class="button button-danger" type="submit">Delete student</button>
        </div>
    </form>
</section>
{% endblock %}
